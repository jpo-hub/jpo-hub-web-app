# Stack complète du HUB JPO
#
#   internet ──:80──> frontend (nginx : front statique + proxy /api)
#                        │ réseau "web"
#                     backend (NestJS :3000, non publié)
#                        │ réseau "data" (internal: true)
#                     db (PostgreSQL :5432, non publié, sans accès internet)
#
# La base de données n'a AUCUN port publié et vit sur un réseau
# interne : elle est injoignable depuis internet comme depuis l'hôte.
#
# Démarrage :
#   docker compose up -d --build
#   docker compose exec backend npx prisma db seed   # premier lancement uniquement

services:
  db:
    image: postgres:16.1-alpine
    container_name: jpo-hub-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - data

  backend:
    build: ./backend
    container_name: jpo-hub-api
    restart: unless-stopped
    # Réutilise ton backend/.env de dev (AWS S3, JWT_SECRET…)
    env_file:
      - ./backend/.env
    # …mais DATABASE_URL est écrasée pour pointer vers le conteneur db
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-jpo-hub}:${POSTGRES_PASSWORD:-kantin}@db:5432/${POSTGRES_DB:-jpo-hub-db}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
      - web

  frontend:
    build: ./frontend
    container_name: jpo-hub-web
    restart: unless-stopped
    ports:
      - '${HTTP_PORT}:80'
    depends_on:
      - backend
    networks:
      - web

networks:
  # Réseau exposé : nginx <-> backend
  web:
  # Réseau interne : backend <-> db. "internal: true" interdit toute
  # connectivité extérieure (pas de port publiable, pas d'accès internet)
  data:
    internal: true

volumes:
  db-data:
