services:
  postgres:
    image: postgres:16.1-alpine
    container_name: backend-jpo-hub-db
    restart: always
    environment:
      - POSTGRES_USER=jpo-hub
      - POSTGRES_PASSWORD=kantin
      - POSTGRES_DB=jpo-hub-db
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - '5432:5432'
volumes:
  postgres: