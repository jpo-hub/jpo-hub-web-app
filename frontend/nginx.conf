# Reverse proxy unique du HUB JPO :
# - sert le build Angular statique
# - proxifie /api/* vers le backend NestJS (réseau interne Docker)
# Le backend et PostgreSQL ne sont jamais exposés directement.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html index.csr.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API : transmise telle quelle au backend (le préfixe /api est
  # géré côté NestJS par setGlobalPrefix). "^~" empêche la location
  # regex des assets d'intercepter les .js/.css du Swagger UI
  location ^~ /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Assets fingerprintés : cache long
  location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # SPA Angular : toute route inconnue retombe sur le shell client
  location / {
    try_files $uri $uri/ /index.csr.html;
  }
}
