<div class="form-group" [class.has-value]="value">
  <textarea
    #textarea
    [(ngModel)]="value"
    (input)="onInput($event); textarea.style.height = 'auto'; textarea.style.height = textarea.scrollHeight + 'px'"
    (keyup)="textarea.style.height = 'auto'; textarea.style.height = textarea.scrollHeight + 'px'"
    (focus)="textarea.style.height = 'auto'; textarea.style.height = textarea.scrollHeight + 'px'"
    (blur)="onTouched()"
    rows="1"
    style="overflow: hidden; resize: none;"
  ></textarea>
  <label>{{ label }}</label>
</div>
