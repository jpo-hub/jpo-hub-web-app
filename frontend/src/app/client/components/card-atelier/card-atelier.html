<div class="card-atelier" role="listitem">
  <div class="img-wrapper">
    <img [src]="imageUrl"
         [alt]="label"
         class="atelier-img"
         (error)="handleImageError($event)">
  </div>

  <div class="content">
    <h2>{{ label }}</h2>
    <p>{{ shortDescription }}</p>
  </div>

  <div class="card-footer">
    <app-button-primary label="Participer" (click)="onParticiper()"/>
  </div>
</div>
