<main>

  @if (showNavBar()) {
    <app-nav-bar/>
  }

  <div class="main-container">

    <app-toast/>

    <app-modal-participation
      [isVisible]="modalService.isVisible()"
      [labelAtelier]="modalService.selectedAtelier()?.label || ''"
      [codeParticipation]="modalService.selectedAtelier()?.code || 0"
      [onClose]="modalService.close.bind(modalService)">
    </app-modal-participation>

    <router-outlet/>
  </div>
</main>
