<section>
  <div class="quiz-container">
    <div class="quiz-title">
      <h2>Quiz</h2>
      <span>Recherchez, filtrez et gérez toutes les questions et réponses de la JPO</span>
    </div>

    <div class="quiz-content">
      <div class="quiz-content__filters">
        <div class="quiz-recherche-bar">
          <input type="text" placeholder="Rechercher une question" class="quiz-recherche-bar">
        </div>
        <div>
          <button class="primary">Créer</button>
        </div>
      </div>
      @for (question of questions(); track question.uid) {
        <div class="quiz-question-container">
          <div class="quiz-question">
            <div class="quiz-question__title">
              <h3>{{ question.label }}</h3>
            </div>
            <div class="quiz-question__content">
              @if (question.draft) {
                <span class="badge draft">Brouillon</span>
              } @else {
                <span class="badge published">publiée</span>
              }

              @if (question.multiple) {
                <span class="badge multiple">Multiples</span>
              }
            </div>
          </div>
          <div class="actions">
            <button class="secondary">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/>
              </svg>
              Modifier
            </button>
            <button class="secondary">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                   class="lucide lucide-trash-icon lucide-trash">
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                <path d="M3 6h18"/>
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
              Supprimer
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</section>
