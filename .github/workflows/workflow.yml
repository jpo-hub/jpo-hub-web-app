# CI/CD du HUB JPO
#
#   push sur main ──> ci-backend  (tests + build NestJS)   ─┐
#                ──> ci-frontend (build Angular)           ─┤
#                                                           └─> deploy : SSH sur le
#                                                               Raspberry Pi, git pull
#                                                               + docker compose up -d --build
#

name: Deploy jpo-hub-web-app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  ci-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # prisma.config.ts exige DATABASE_URL dès son chargement : URL factice,
      # ni `generate` ni les tests unitaires ne se connectent à la base
      DATABASE_URL: postgres://build:build@localhost:5432/build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

  ci-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Même commande que frontend/Dockerfile : build statique sans SSR,
      # le prerender échoue sinon car l'API n'est pas joignable pendant le build
      - name: Build
        run: npx ng build --configuration production,docker

  deploy:
    runs-on: ubuntu-latest
    needs: [ci-backend, ci-frontend]
    steps:
      - name: Deploy on Raspberry Pi
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.RPI_HOST }}
          username: ${{ secrets.RPI_USERNAME }}
          key: ${{ secrets.RPI_SSH_KEY }}
          port: 2222
          script: |
            set -e
            # Adapte ce chemin si le dépôt est cloné ailleurs sur le Pi
            cd "$HOME/jpo-hub-web-app"
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            # Supprime les images orphelines laissées par les rebuilds
            docker image prune -f
